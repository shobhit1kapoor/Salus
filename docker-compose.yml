services:
  pattern-provider-service:
    image: public.ecr.aws/protegrity-ai-developer-edition/pattern-provider:2.0.0.320.59776828
    restart: unless-stopped
    networks: [default]
  context-provider-service:
    image: public.ecr.aws/protegrity-ai-developer-edition/context-provider:2.0.0.242.5041932c
    restart: unless-stopped
    networks: [default]
  classification-service:
    image: public.ecr.aws/protegrity-ai-developer-edition/classification-service:2.0.0.374.8047721c
    restart: unless-stopped
    ports: ["8580:8050"]
    environment:
      PROVIDERS: '[{"name":"Pattern","address":"http://pattern-provider-service:8051"},{"name":"Context","address":"http://context-provider-service:8052"}]'
    depends_on: [pattern-provider-service, context-provider-service]
  semantic-guardrail-service:
    image: public.ecr.aws/protegrity-ai-developer-edition/semantic-guardrail:1.1.1-36-1b3de114
    restart: unless-stopped
    ports: ["8581:8001"]
    environment:
      LOG_LEVEL: WARNING
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on: [classification-service]
  privacy-gateway:
    build:
      context: .
      dockerfile: apps/privacy-gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SALUS_PRIVACY_MODE: protegrity
      PROTEGRITY_DISCOVERY_URL: http://classification-service:8050/pty/data-discovery/v2/classify/text
      PROTEGRITY_GUARDRAIL_URL: http://semantic-guardrail-service:8001/pty/semantic-guardrail/v1.1
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on: [classification-service, semantic-guardrail-service]
  api:
    build:
      context: .
      args: { APP: api }
    command: sh -c "npm run schema:apply -w @salus/api && npm run start -w @salus/api"
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-salus_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salus}
      DATABASE_URL: postgresql://salus_app:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salus}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      SMTP_HOST: mailpit
      PRIVACY_GATEWAY_URL: http://privacy-gateway:8080
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
      clamav: { condition: service_started }
      privacy-gateway: { condition: service_healthy }
  web:
    build:
      context: .
      args:
        APP: web
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    command: npm run start -w @salus/web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }
  worker:
    build:
      context: .
      args: { APP: worker }
    command: npm run start -w @salus/worker
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-salus_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salus}
      DATABASE_URL: postgresql://salus_app:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salus}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      SMTP_HOST: mailpit
      PRIVACY_GATEWAY_URL: http://privacy-gateway:8080
    depends_on: [api, redis, minio, mailpit, privacy-gateway]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salus}
      POSTGRES_USER: ${POSTGRES_USER:-salus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salus_admin} -d ${POSTGRES_DB:-salus}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  create-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY; do sleep 2; done;
      mc mb --ignore-existing local/$$S3_BUCKET; mc anonymous set none local/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-salus-private}
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    volumes: [clamav_data:/var/lib/clamav]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  prometheus_data:
